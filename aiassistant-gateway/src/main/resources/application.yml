server:
  port: 8080

spring:
  application:
    name: aiassistant-gateway
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/ai_assistant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
  cloud:
    gateway:
      httpclient:
        response-timeout: 300s
        connect-timeout: 5000
      routes:
        - id: agent-chat-sse
          uri: lb://aiassistant-agent
          predicates:
            - Path=/api/chat/stream
          filters:
            - StripPrefix=0
        - id: agent-service
          uri: lb://aiassistant-agent
          predicates:
            - Path=/api/chat/**,/api/conversation/**
          filters:
            - StripPrefix=0
        - id: document-parse
          uri: lb://aiassistant-document-parse
          predicates:
            - Path=/api/document/parse
          filters:
            - StripPrefix=0
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

  kafka:
    bootstrap-servers: ${KAFKA_ADDR:127.0.0.1:9092}

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: aiassistant

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true
  is-read-cookie: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.aiassistant.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
