# ============================================================
# AI Assistant - Nginx Server Configuration
# Nginx 1.29
# Place this file at /etc/nginx/conf.d/api.conf
# ============================================================

# IP-based rate limiting zones (http context, before server block)
limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=ip_conn:10m;

upstream gateway_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name localhost;

    # ----------------------------------------------------------
    # Frontend static assets (Vue build output)
    # ----------------------------------------------------------
    root /usr/share/nginx/html/api;
    index index.html;

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----------------------------------------------------------
    # SSE-dedicated location (chat streaming endpoint)
    # Must be placed before the generic /api/ block;
    # Nginx matches by longest prefix
    # ----------------------------------------------------------
    location /api/chat/stream {
        limit_req zone=ip_limit burst=50 nodelay;
        limit_conn ip_conn 50;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://gateway_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE critical settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # HTTP/1.1 persistent connection
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ----------------------------------------------------------
    # Generic API reverse proxy -> Gateway
    # ----------------------------------------------------------
    location /api/ {
        limit_req zone=ip_limit burst=200 nodelay;
        limit_conn ip_conn 100;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://gateway_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ----------------------------------------------------------
    # Health check
    # ----------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ----------------------------------------------------------
    # SPA fallback (Vue Router history mode)
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------
    # 429 rate-limited error page
    # ----------------------------------------------------------
    error_page 429 @rate_limited;
    location @rate_limited {
        internal;
        default_type application/json;
        return 429 '{"code":429,"message":"Too many requests, please try again later"}';
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
